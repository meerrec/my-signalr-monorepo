name: signalr-chat

services:
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    image: signalr-chat-server:local
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
    expose:
      - "8080"
    restart: unless-stopped
    # ASP.NET Core дренирует ChatWorkQueue по SIGTERM; docker по умолчанию
    # убивает контейнер через 10 секунд и не даёт очереди доработать.
    stop_grace_period: 35s
    networks:
      - chat

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        # Переопределяется только одноимённой переменной DOCKER_SIGNALR_URL:
        # VITE_SIGNALR_URL из локального .env описывает dev-окружение и здесь
        # не должна подхватываться.
        VITE_SIGNALR_URL: ${DOCKER_SIGNALR_URL:-/hubs/chat}
    image: signalr-chat-web:local
    environment:
      SIGNALR_BACKEND: server:8080
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - chat

networks:
  chat:
    driver: bridge
